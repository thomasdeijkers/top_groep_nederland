<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inloggen - Top Groep Nederland</title>
    <link rel="icon" href="/dashboard/static/favicon.ico">
    <link rel="stylesheet" href="/dashboard/static/auth.css">
</head>
<body>
    <main class="login-shell">
        <section class="login-panel" aria-labelledby="login-title">
            <img src="/dashboard/static/top-groep-nederland.png" alt="Top Groep Nederland">
            <h1 id="login-title">Beveiligde toegang</h1>
            {% if error %}
                <p class="login-error">De gebruikersnaam, het wachtwoord of de authenticator-code klopt niet.</p>
            {% endif %}
            {% if not auth_enabled %}
                <p class="login-note">2FA staat nog niet aan voor deze omgeving.</p>
            {% endif %}
            <form method="post" action="/login">
                <input type="hidden" name="next" value="{{ next }}">
                <label>Gebruikersnaam <input name="username" autocomplete="username" required autofocus></label>
                <label>Wachtwoord <input name="password" type="password" autocomplete="current-password" required></label>
                <label>Authenticator-code <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,8}" required></label>
                <button type="submit">Inloggen</button>
            </form>
        </section>
    </main>
</body>
</html>
